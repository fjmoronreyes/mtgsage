[project]
name = "mtgsage"
version = "0.1.0"
description = "An evidence-grounded AI assistant for Magic: The Gathering"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["pymupdf (>=1.28.2,<2.0.0)"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
